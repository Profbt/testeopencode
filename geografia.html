<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geografia Explorer</title>
  <link rel="stylesheet" href="geografia/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <!-- MENU SCREEN -->
  <div id="menu-screen" class="screen active">
    <div class="menu-container">
      <div class="menu-header">
        <div class="logo-globe">
          <span class="globe-icon">🌎</span>
        </div>
        <h1>Geografia Explorer</h1>
        <p class="subtitle">Explore o mundo enquanto joga</p>
      </div>

      <div class="menu-section">
        <h2>Escolha o Modo</h2>
        <div class="mode-cards">
          <button class="mode-card selected" data-mode="dragdrop">
            <div class="mode-icon">🧩</div>
            <h3>Monte o Mapa</h3>
            <p>Arraste os estados para a posição correta no mapa</p>
          </button>
          <button class="mode-card" data-mode="quiz">
            <div class="mode-icon">❓</div>
            <h3>Quiz no Mapa</h3>
            <p>Descubra o estado/capital destacado no mapa</p>
          </button>
        </div>
      </div>

      <div class="menu-section">
        <h2>Selecione a Região</h2>
        <div class="region-buttons">
          <button class="region-btn selected" data-region="brasil" data-states="27">
            <span class="region-flag">🇧🇷</span>
            <span class="region-info">
              <strong>Brasil</strong>
              <span>27 estados</span>
            </span>
          </button>
          <button class="region-btn disabled" data-region="norte" data-states="7">
            <span class="region-flag">🟢</span>
            <span class="region-info">
              <strong>Norte</strong>
              <span>7 estados</span>
            </span>
          </button>
          <button class="region-btn disabled" data-region="nordeste" data-states="9">
            <span class="region-flag">🟡</span>
            <span class="region-info">
              <strong>Nordeste</strong>
              <span>9 estados</span>
            </span>
          </button>
          <button class="region-btn disabled" data-region="sudeste" data-states="4">
            <span class="region-flag">🔵</span>
            <span class="region-info">
              <strong>Sudeste</strong>
              <span>4 estados</span>
            </span>
          </button>
          <button class="region-btn disabled" data-region="sul" data-states="3">
            <span class="region-flag">🔴</span>
            <span class="region-info">
              <strong>Sul</strong>
              <span>3 estados</span>
            </span>
          </button>
          <button class="region-btn disabled" data-region="centro" data-states="4">
            <span class="region-flag">🟣</span>
            <span class="region-info">
              <strong>Centro-Oeste</strong>
              <span>4 estados</span>
            </span>
          </button>
        </div>
      </div>

      <div class="menu-section">
        <h2>Dificuldade</h2>
        <div class="difficulty-buttons">
          <button class="diff-btn selected" data-diff="facil">
            <span class="diff-icon">⭐</span> Fácil
          </button>
          <button class="diff-btn" data-diff="medio">
            <span class="diff-icon">⭐⭐</span> Médio
          </button>
          <button class="diff-btn" data-diff="dificil">
            <span class="diff-icon">⭐⭐⭐</span> Difícil
          </button>
        </div>
      </div>

      <button id="start-btn" class="btn-start">
        <span>Iniciar Jogo</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>

      <div class="menu-footer">
        <button id="scores-btn" class="btn-scores">🏆 Ver Recordes</button>
      </div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen">
    <div class="game-wrapper">
      <div class="game-header">
        <button id="back-to-menu" class="btn-back" title="Voltar ao menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="game-info">
          <span id="mode-title" class="mode-title"></span>
          <span id="region-title" class="region-title"></span>
        </div>
      </div>

      <div class="game-stats">
        <div class="stat-item score-stat">
          <span class="stat-icon">💎</span>
          <span id="score-display" class="stat-value">0</span>
        </div>
        <div class="stat-item combo-stat">
          <span class="stat-icon">🔥</span>
          <span id="combo-display" class="stat-value">x1</span>
        </div>
        <div class="stat-item lives-stat">
          <span id="lives-display" class="lives"></span>
        </div>
        <div class="stat-item timer-stat">
          <span class="stat-icon">⏱</span>
          <span id="timer-display" class="stat-value">--:--</span>
        </div>
        <div class="stat-item hints-stat">
          <button id="hint-btn" class="btn-hint" title="Usar dica (restam 3)">
            💡 <span id="hints-count">3</span>
          </button>
        </div>
      </div>

      <div class="game-area">
        <div class="map-container">
          <div class="map-wrapper">
            <svg id="game-map" class="game-map" viewBox="0 0 800 1050"></svg>
            <div id="map-pieces" class="map-pieces"></div>
          </div>
        </div>

        <div id="sidebar" class="game-sidebar">
          <div class="sidebar-panel">
            <h3>Peças Disponíveis</h3>
            <div id="pieces-pool" class="pieces-pool"></div>
          </div>

          <div id="quiz-panel" class="sidebar-panel hidden">
            <h3>Responda</h3>
            <div id="quiz-question" class="quiz-question"></div>
            <div id="quiz-options" class="quiz-options"></div>
          </div>
        </div>
      </div>

      <div id="progress-bar" class="progress-bar">
        <div class="progress-fill"></div>
        <span class="progress-text">0/0</span>
      </div>
    </div>
  </div>

  <!-- HINT OVERLAY -->
  <div id="hint-overlay" class="hint-overlay hidden">
    <div class="hint-content">
      <div class="hint-icon">💡</div>
      <h3>Dica!</h3>
      <p id="hint-text"></p>
      <button id="hint-close" class="btn-hint-close">Entendi!</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="screen">
    <div class="results-container">
      <div class="results-glow"></div>
      <div class="results-icon" id="results-icon">🏆</div>
      <h2 id="results-title"></h2>
      <p id="results-subtitle"></p>

      <div class="results-stats">
        <div class="result-card">
          <span class="result-value" id="result-score">0</span>
          <span class="result-label">Pontuação</span>
        </div>
        <div class="result-card">
          <span class="result-value" id="result-accuracy">0%</span>
          <span class="result-label">Precisão</span>
        </div>
        <div class="result-card">
          <span class="result-value" id="result-time">--:--</span>
          <span class="result-label">Tempo</span>
        </div>
        <div class="result-card">
          <span class="result-value" id="result-combo">x1</span>
          <span class="result-label">Melhor Combo</span>
        </div>
      </div>

      <div id="results-details" class="results-details">
        <h3>Detalhes</h3>
        <div id="results-list"></div>
      </div>

      <div class="results-actions">
        <button id="results-menu" class="btn-results">🏠 Menu Principal</button>
        <button id="results-retry" class="btn-results retry">🔄 Jogar Novamente</button>
      </div>
    </div>
  </div>

  <!-- SCORES MODAL -->
  <div id="scores-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🏆 Recordes</h2>
        <button id="close-scores" class="btn-close">×</button>
      </div>
      <div id="scores-list" class="scores-list">
        <div class="empty-scores">
          <p>Nenhum recorde ainda!</p>
          <p>Jogue sua primeira partida.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="geografia/script.js"></script>
</body>
</html>
